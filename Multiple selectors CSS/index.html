  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple selectors CSS</title>

  <body>
    <head>
      <style>
        h1,
        h2,
        h3,
        p {
          color: blue;
          font-family: Arial, Helvetica, sans-serif;
          font-size: 20px;
        }
      </style>
    </head>

    <h1>Welcome to my page</h1>
    <h2>Lerning CSS</h2>
    <h3>Multiple Selectors</h3>

  </body>
